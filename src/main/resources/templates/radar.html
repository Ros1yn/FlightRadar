<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Test Radaru</title>
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
</head>
<body>
<h1>Konsola Radaru</h1>
<p>Otwórz narzędzia deweloperskie (F12) -> zakładka Console, żeby zobaczyć przychodzące samoloty.</p>

<script>
    let socket = new SockJS('/ws');

    let stompClient = Stomp.over(socket);

    stompClient.connect({}, function (frame) {
        console.log('Połączono: ' + frame);

        stompClient.subscribe('/topic/flights', function (message) {

            let flights = JSON.parse(message.body);

            console.log("Otrzymano nową paczkę samolotów: ", flights.length);

            if (flights.length > 0) {
                console.log("Przykładowy lot:", flights[0]);
            }
        });
    });
</script>

</body>
</html>
